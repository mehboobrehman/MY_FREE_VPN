name: my_free_vpn
description: A free VPN for android and windows for lifetime with zero setup.
publish_to: 'none'

version: 1.1.7+8

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.2.0
  shared_preferences: ^2.2.3
  uuid: ^4.3.3
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  flutter_udid: ^2.0.1
  logger: ^2.3.0
  tray_manager: ^0.2.0
  window_manager: ^0.3.9
  bitsdojo_window: ^0.1.6
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
